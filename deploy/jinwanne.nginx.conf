limit_req_zone $binary_remote_addr zone=jinwanne_api_limit:10m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=jinwanne_conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name jinwanne.woaizhuzhu.com;
    return 301 https://jinwanne.woaizhuzhu.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jinwanne.woaizhuzhu.com;

    ssl_certificate /etc/nginx/ssl/jinwanne.woaizhuzhu.com/jinwanne.woaizhuzhu.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/jinwanne.woaizhuzhu.com/jinwanne.woaizhuzhu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:JinwanneSSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/jinwanne-error.log warn;
    client_max_body_size 16k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    limit_conn jinwanne_conn_limit 20;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=jinwanne_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3356;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_max_temp_file_size 0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3356;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_max_temp_file_size 0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }
}
