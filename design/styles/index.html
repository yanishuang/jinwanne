<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>今晚呢 · 四种风格</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f2ef;color:#242426;font-family:"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1600px;margin:auto;padding:36px 30px 60px}header{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:27px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 10px}p{font-size:14px;color:#747473;line-height:1.7;margin:0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}button{font:inherit;border:1px solid #d6d5d0;background:transparent;padding:10px 15px;border-radius:7px;color:#4b4b4a;cursor:pointer;font-size:13px}button.active{background:#252528;color:#fff;border-color:#252528}button:hover{border-color:#696967}button:focus-visible,a:focus-visible{outline:2px solid #40669c;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}.grid.single{grid-template-columns:1fr;max-width:1250px;margin:auto}.choice{min-width:0;background:#fff;border:1px solid #e3e1dc;border-radius:12px;overflow:hidden}.choice[hidden]{display:none}.label{display:flex;align-items:center;justify-content:space-between;padding:19px 21px;gap:15px}.title{display:flex;align-items:center;gap:10px}.title strong{font-size:18px}.letter{width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center;background:#efeeea;border-radius:5px;font-size:13px}.label small{display:block;color:#777;margin-top:6px;font-size:12px}.swatches{display:flex;gap:5px}.swatches i{display:block;width:15px;height:15px;border-radius:50%;border:1px solid #00000016}img{display:block;width:100%;height:auto}.image-link{display:block}.image-link:hover{opacity:.97}footer{border-top:1px solid #dcdbd7;margin-top:28px;padding-top:20px;font-size:13px;color:#686867;line-height:1.8}.single .label{padding:22px 26px}.single img{max-height:calc(100vh - 210px);object-fit:contain;background:#f5f4f1}@media(max-width:760px){main{padding:24px 14px 35px}header{align-items:start;flex-direction:column;gap:9px;margin-bottom:20px}h1{font-size:24px}.grid{grid-template-columns:1fr;gap:18px}.label{padding:15px}.title strong{font-size:16px}nav{gap:6px}button{font-size:12px;padding:9px 11px}p{font-size:12px}.single img{max-height:none}}
</style>
</head>
<body><main>
<header><div><h1>今晚呢，选一种感觉。</h1><p>同样的两个页面，四种风格。只比较设计，数字均为示例。</p></div><p>简单 · 男性向 · 无绿色</p></header>
<nav aria-label="设计风格"><button class="active" data-choice="all" aria-pressed="true">四套总览</button><button data-choice="A" aria-pressed="false">A 炭黑亮橙</button><button data-choice="B" aria-pressed="false">B 雾白钴蓝</button><button data-choice="C" aria-pressed="false">C 午夜冰银</button><button data-choice="D" aria-pressed="false">D 沙岩深棕</button></nav>
<div class="grid">
<article class="choice" data-id="A"><div class="label"><div><div class="title"><span class="letter">A</span><strong>炭黑亮橙</strong></div><small>运动感 · 强对比 · 大数字</small></div><span class="swatches"><i style="background:#151619"></i><i style="background:#ff793e"></i><i style="background:#f4f2ed"></i></span></div><a class="image-link" href="A-charcoal-orange.png" target="_blank" rel="noopener"><img src="A-charcoal-orange.png" alt="A 炭黑亮橙风格：记录页与排行榜页"></a></article>
<article class="choice" data-id="B"><div class="label"><div><div class="title"><span class="letter">B</span><strong>雾白钴蓝</strong></div><small>清爽 · 理性 · 日常工具</small></div><span class="swatches"><i style="background:#fff"></i><i style="background:#245ddb"></i><i style="background:#18273d"></i></span></div><a class="image-link" href="B-white-cobalt.png" target="_blank" rel="noopener"><img src="B-white-cobalt.png" alt="B 雾白钴蓝风格：记录页与排行榜页"></a></article>
<article class="choice" data-id="C"><div class="label"><div><div class="title"><span class="letter">C</span><strong>午夜冰银</strong></div><small>克制 · 精密 · 深色科技感</small></div><span class="swatches"><i style="background:#111c2f"></i><i style="background:#8fb7e5"></i><i style="background:#e4eaf4"></i></span></div><a class="image-link" href="C-midnight-silver.png" target="_blank" rel="noopener"><img src="C-midnight-silver.png" alt="C 午夜冰银风格：记录页与排行榜页"></a></article>
<article class="choice" data-id="D"><div class="label"><div><div class="title"><span class="letter">D</span><strong>沙岩深棕</strong></div><small>低调 · 器物感 · 温暖中性色</small></div><span class="swatches"><i style="background:#e7e2d9"></i><i style="background:#332a23"></i><i style="background:#99583e"></i></span></div><a class="image-link" href="D-sand-brown.png" target="_blank" rel="noopener"><img src="D-sand-brown.png" alt="D 沙岩深棕风格：记录页与排行榜页"></a></article>
</div><footer>点击上方标签可放大某一套。选好后，直接在对话里告诉我 A、B、C 或 D；也可以混搭配色和布局。当前没有选定方案，也没有开始按新设计开发。</footer>
</main><script>
const buttons=[...document.querySelectorAll('nav button')];
for(const button of buttons)button.addEventListener('click',()=>{const choice=button.dataset.choice;for(const b of buttons){const selected=b===button;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))}document.querySelector('.grid').classList.toggle('single',choice!=='all');for(const card of document.querySelectorAll('.choice'))card.hidden=choice!=='all'&&card.dataset.id!==choice});
</script></body></html>
